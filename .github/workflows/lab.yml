name: Refresh lab (daily spike check)

on:
  schedule:
    # 01:30 UTC = 07:00 IST, every day. Cron on GitHub is always UTC.
    - cron: '30 1 * * *'
  workflow_dispatch:   # lets you run it by hand from the Actions tab (use this to test)

# Required so the job can commit the updated data file back to the repo.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Fetch lab data
        run: python tracker.py lab
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Commit data
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/lab_data.json docs/tech_data.json
          git commit -m "lab refresh $(date -u +%F)" || echo "no changes to commit"
          git push
