name: Refresh field (weekly trend)

on:
  schedule:
    # 02:00 UTC every Monday. CrUX updates on a weekly cadence, so weekly is enough.
    - cron: '0 2 * * 1'
  workflow_dispatch:   # lets you run it by hand from the Actions tab (use this to test)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Fetch field data
        run: python tracker.py field
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Commit data
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/field_data.json
          git commit -m "field refresh $(date -u +%F)" || echo "no changes to commit"
          git push
